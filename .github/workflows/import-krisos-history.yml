name: Import KrisOS history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-krisos-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout archive repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Import KrisOS main with full history
        shell: bash
        run: |
          set -euo pipefail
          expected='4be27021c77f3942d896e5a59baeb3af1e78e3ed'
          git remote add krisos https://github.com/krism-eu/KrisOS.git
          git fetch --no-tags krisos main
          actual="$(git rev-parse refs/remotes/krisos/main)"
          test "$actual" = "$expected"
          git push origin refs/remotes/krisos/main:refs/heads/KrisOS
          remote="$(git ls-remote origin refs/heads/KrisOS | awk '{print $1}')"
          test "$remote" = "$expected"
          echo "Imported KrisOS branch at $remote"
