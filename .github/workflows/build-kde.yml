name: Build RakuOS KDE

on:
  push:
    branches:
      - main
    paths:
      - "rakuos-kde/**"
      - ".github/workflows/build-kde.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: krism-eu/rakuos-base
  IMAGE_TAG: kde

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Build KDE image
        run: |
          set -euo pipefail

          podman build \
            --pull=always \
            -f rakuos-kde/Containerfile \
            -t "localhost/${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Push KDE image
        run: |
          set -euo pipefail

          podman push \
            "localhost/${IMAGE_NAME}:${IMAGE_TAG}" \
            "docker://${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
