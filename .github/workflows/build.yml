name: Build RakuOS KDE Custom

on:
  push:
    branches:
      - main
    paths:
      - "Containerfile"
      - "build_files/**"
      - "system_files/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: rakuos-kde-custom-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: krism-eu/rakuos-kde-custom
  IMAGE_TAG: latest

jobs:
  build:
    name: Build and publish RakuOS KDE Custom
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Build custom image
        run: |
          set -euo pipefail

          podman build \
            --pull=always \
            --file ./Containerfile \
            --tag "localhost/${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Push custom image
        run: |
          set -euo pipefail

          podman push \
            "localhost/${IMAGE_NAME}:${IMAGE_TAG}" \
            "docker://${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
